<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>底部操作栏 Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #17181a;
      }

      body {
        min-height: 100dvh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      button {
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }

      .demo {
        position: relative;
        min-height: 100dvh;
        background:
          linear-gradient(to bottom, transparent 45%, #17181a 77%),
          #1d1e20;
      }

      .bottom-area {
        --panel-height: 118px;
        --button-center-y: -11px;
        --main-button-size: 72px;
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: var(--panel-height);
      }

      .panel-shape {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .actions {
        position: absolute;
        z-index: 2;
        top: var(--button-center-y);
        left: 50%;
        display: flex;
        align-items: center;
        gap: 42px;
        transform: translate(-50%, -50%);
      }

      .action {
        display: grid;
        width: 50px;
        height: 50px;
        flex: 0 0 50px;
        place-items: center;
        border-radius: 50%;
        transition: transform 160ms ease, filter 160ms ease;
      }

      .action:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }

      .action:active {
        transform: scale(0.94);
      }

      .skip {
        background: #353738;
      }

      .skip img {
        width: 18px;
        height: 18px;
      }

      .primary {
        position: relative;
        overflow: hidden;
        width: var(--main-button-size);
        height: var(--main-button-size);
        flex-basis: var(--main-button-size);
        background: none;
        box-shadow: 0 10px 0 #17181a, 0 15px 28px rgba(0, 0, 0, 0.2);
      }

      .primary::before {
        content: "";
        position: absolute;
        inset: -5px -3px -26px -28px;
        background: url("./assets/f92b3.png") center / cover no-repeat;
        pointer-events: none;
      }

      .primary img {
        position: relative;
        z-index: 1;
        width: 32px;
        height: 32px;
      }

      .actions > .action:not(.primary) {
        position: relative;
        top: 4px;
      }

      .like img {
        width: 50px;
        height: 50px;
      }

      .navigation {
        position: absolute;
        z-index: 1;
        top: 49px;
        right: 34px;
        left: 34px;
        display: flex;
        justify-content: space-between;
      }

      .navigation button,
      .navigation img {
        display: block;
        width: 26px;
        height: 26px;
      }

      @media (min-width: 700px) {
        .bottom-area {
          right: 50%;
          left: 50%;
          width: min(100%, 520px);
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <section class="bottom-area" aria-label="底部操作区">
        <svg class="panel-shape" aria-hidden="true" preserveAspectRatio="none">
          <path fill="#232527"></path>
        </svg>

        <div class="actions">
          <button class="action skip" aria-label="跳过">
            <img src="./assets/e4d36.svg" alt="" />
          </button>
          <button class="action primary" aria-label="超级喜欢">
            <img src="./assets/01fa2.svg" alt="" />
          </button>
          <button class="action like" aria-label="喜欢">
            <img src="./assets/d052e.svg" alt="" />
          </button>
        </div>

        <nav class="navigation" aria-label="主导航">
          <button aria-label="发现"><img src="./assets/4256b.svg" alt="" /></button>
          <button aria-label="收藏"><img src="./assets/16779.svg" alt="" /></button>
          <button aria-label="喜欢"><img src="./assets/18617.svg" alt="" /></button>
          <button aria-label="消息"><img src="./assets/d9a87.svg" alt="" /></button>
          <button aria-label="个人中心"><img src="./assets/619d9.svg" alt="" /></button>
        </nav>
      </section>
    </main>

    <script>
      const panel = document.querySelector(".bottom-area")
      const svg = document.querySelector(".panel-shape")
      const path = svg.querySelector("path")
      const button = document.querySelector(".primary")

      function drawPanel() {
        const panelRect = panel.getBoundingClientRect()
        const buttonRect = button.getBoundingClientRect()
        const width = panelRect.width
        const height = panelRect.height
        const corner = 20
        const centerX = buttonRect.left + buttonRect.width / 2 - panelRect.left
        const centerY = buttonRect.top + buttonRect.height / 2 - panelRect.top
        const radius = buttonRect.width / 2 + 8
        const halfChord = Math.sqrt(Math.max(0, radius * radius - centerY * centerY))
        const left = centerX - halfChord
        const right = centerX + halfChord

        svg.setAttribute("viewBox", `0 0 ${width} ${height}`)
        path.setAttribute(
          "d",
          [
            `M ${corner} 0`,
            `H ${left}`,
            `A ${radius} ${radius} 0 0 0 ${right} 0`,
            `H ${width - corner}`,
            `Q ${width} 0 ${width} ${corner}`,
            `V ${height}`,
            "H 0",
            `V ${corner}`,
            `Q 0 0 ${corner} 0`,
            "Z",
          ].join(" "),
        )
      }

      const resizeObserver = new ResizeObserver(drawPanel)
      resizeObserver.observe(panel)
      resizeObserver.observe(button)
      drawPanel()
    </script>
  </body>
</html>
